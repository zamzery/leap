<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="description" content="LEAP Eos" />
		<meta name="author" content="LEAP" />
		<meta name="referrer" content="origin" />
		<title>LEAP Eos - Login</title>
		<link href="../public/css/styles.css" rel="stylesheet" />
		<link rel="icon" type="image/x-icon" href="../public/images/favicon.ico" />
		<script data-search-pseudo-elements defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/js/all.min.js" crossorigin="anonymous"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js" crossorigin="anonymous"></script>
	</head>
	<body class="body-animation">
		<style>
			.logo{
				padding: 0 5px 5px 5px;
				height: auto;
				width: 250px;
			}

			#titulo{
				font-size: 1.5em;
				font-weight: bold;
				color: #282828;
				font-family: 'Source Sans 3', sans-serif;
				padding-bottom: 25px;
				margin: 50px 0 25px 0;
			}
			@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;900&display=swap');
			* {
				font-family: 'Source Sans 3', sans-serif;
				margin: 0;
			}
			body {
				margin: 0;
				padding: 0;
				font-family: Arial, sans-serif;
			}

			#slider {
				position: relative;
				width: 100%;
				max-width: 800px; /* Ajusta el ancho máximo según tus necesidades */
				height: 100vh; /* Ajusta la altura del slider */
				margin: auto;
				overflow: hidden;
			}

			.slide {
				opacity: 0;
				position: absolute;
				width: 100%;
				height: 100%;
				transition: opacity 1s ease-in-out; /* Agrega la transición fade */
			}

			img {
				width: 100%;
				height: 100%;
				object-fit: cover; /* Ajusta la imagen para cubrir completamente el área del slide */
			}

			.overlay {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: linear-gradient(rgba(43, 43, 43, 0.85), rgba(163, 165, 165, 0.5)); /* Gradiente overlay */
				opacity: 0;
				transition: opacity 1s ease-in-out; /* Agrega la transición fade */
				z-index: 1; /* Asegura que el gradiente esté detrás del contenido */
			}

			.slide.active .overlay {
				opacity: 1;
			}

			.slide.active {
				opacity: 1;
			}

			.slide-content {
				position: relative;
				z-index: 2; /* Asegura que el contenido esté sobre el gradiente */
				color: white; /* Color del texto */
				text-align: center;
				padding: 20px;
				box-sizing: border-box;
			}
			#layoutAuthentication_content{
				z-index: 10;
			}
		</style>
		<div id="layoutAuthentication">
			<div class="slide active">
				<img src="../public/images/slider-1.jpg" alt="Imagen 1">
				<div class="overlay"></div>
			</div>
			<div class="slide">
				<img src="../public/images/slider-2.jpg" alt="Imagen 2">
				<div class="overlay"></div>
			</div>
			<div class="slide">
				<img src="../public/images/slider-3.jpg" alt="Imagen 3">
				<div class="overlay"></div>
			</div>
			<div id="layoutAuthentication_content">
				<main>
					<div class="container-xl px-4">
						<div class="row justify-content-center">
							<div class="col-lg-5">
								<div class="card shadow-lg border-0 rounded-lg mt-5">
									<div class="card-header justify-content-center text-center">
										<span id="titulo" class="mb-4">Sistema de Administración EOS</span><br/>
										<img src="../public/images/Logo.png" class="logo mt-2" alt="Logo Principal" />
									</div>
									<div class="card-body">
										<form id="loginLeap">
											<div class="mb-3">
												<label class="mb-1" htmlfor="inputEmailAddress">Email</label>
												<input class="form-control" autocomplete="username" id="inputEmailAddress" type="email" placeholder="Escribe tu dirección Email" />
											</div>
											<div class="mb-3">
												<label class="mb-1" htmlfor="inputPassword">Contraseña</label>
												<input class="form-control" autocomplete="current-password" id="inputPassword" type="password" placeholder="Escribe tu contraseña" />
											</div>
											<div class="d-flex align-items-center justify-content-between mt-4 mb-0">
												<button type="button" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#modalRecuperaContrasena">¿Olvidaste tu contraseña?</button>
												<button class="btn btn-dark" type="submit" value="Acceder" >Acceder</button>
											</div>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>
				</main>
			</div>
			<div id="layoutAuthentication_footer">
				<footer class="footer-admin mt-auto footer-dark">
					<div class="container-xl px-4 text-center">
						<div class="row">
							<div class="col-md-12 small">©2023 LEAP</div>
						</div>
					</div>
				</footer>
			</div>
		</div>
		<div class="modal fade" id="modalRecuperaContrasena" tabindex="1" role="dialog" aria-labelledby="modalRecuperaContrasena" aria-hidden="true">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="modalRecuperaContrasenaTitulo">Recupera tu Contraseña</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<form id="formRecuperaContrasena">
								<label>Escribe tu email registrado</label>
								<input type="email" id="emailRecuperacion" class="form-control" placeholder="Escribe tu email" />
							</form>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cerrar</button>
							<button type="submit" form="formRecuperaContrasena"  class="btn btn-primary">Enviar</button>
						</div>
				</div>
			</div>
		</div>
		<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
		<script src="../public/scripts/bootstrap5.js" type="text/javascript"></script>
		<script src="../public/scripts/bootbox.min.js" type="text/javascript" charset="UTF-8"></script>
		<script src="./auth.js"></script>
	</body>
</html>
